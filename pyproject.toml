[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qnx-mcp-server"
version = "0.1.0"
description = "Read-only QNX 8.0 diagnostics over MCP and SSH"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "asyncssh>=2.24.0,<3",
    "mcp==2.3.0",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
qnx-mcp = "qnx_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/qnx_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/targets", "/docs", "/README.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".uv-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
